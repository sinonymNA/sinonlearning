<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUSPECT Mission Control</title><style>:root{--ink:#eaf5ff;--muted:#8da5bb;--cyan:#42d9ff;--violet:#8b6cff;--red:#ff5370;--panel:rgba(10,22,42,.92)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#040914;color:var(--ink);font:500 15px/1.45 system-ui,Segoe UI,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#15335c88,transparent 35%),radial-gradient(circle at 80% 80%,#321c5d77,transparent 35%);pointer-events:none}#stars{position:fixed;inset:0;width:100%;height:100%;opacity:.55}main{position:relative;z-index:1}.panel{background:linear-gradient(145deg,rgba(18,38,67,.96),rgba(7,15,30,.96));border:1px solid #4a719366;border-radius:18px;box-shadow:0 25px 80px #0009,inset 0 1px #ffffff18;padding:28px}.hero{width:min(480px,calc(100% - 32px));margin:7vh auto;text-align:center}.eyebrow{color:var(--cyan);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.2em}.hero h1{font-size:clamp(58px,13vw,92px);line-height:.9;letter-spacing:-.08em;margin:25px 0 10px;text-shadow:0 0 40px #42d9ff55}.hero h1 span{color:var(--cyan)}.tag{color:#b7c9d8;font-size:18px;margin:0 0 30px}label{display:block;text-align:left;color:var(--muted);font-size:12px;margin:13px 0}input,select{display:block;width:100%;margin-top:6px;background:#071426;border:1px solid #34516d;color:white;padding:13px;border-radius:9px;font:inherit;text-transform:none}#code{text-transform:uppercase;letter-spacing:.22em}.colors{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.colors button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}.colors button.selected{border-color:#fff;box-shadow:0 0 15px currentColor;transform:scale(1.15)}button{border:1px solid #496a84;background:#132a44;color:white;padding:12px 17px;border-radius:9px;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.2);transform:translateY(-1px)}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(135deg,#00a8d6,#725be5);border:0;box-shadow:0 8px 25px #28bada33}button.danger{background:#631c31;border-color:#d94867}.hero .primary{width:100%;margin:6px 0 18px}.hero a{color:#9cdff2}.hidden{display:none!important}.error{color:#ff8299;min-height:22px}.roster{display:grid;gap:8px;margin:18px 0}.crew{display:flex;align-items:center;gap:11px;padding:10px;background:#07142699;border-radius:9px}.crew i{width:20px;height:20px;border-radius:50%}.crew small{margin-left:auto;color:var(--muted)}#lobby{width:min(700px,calc(100% - 32px));margin:8vh auto}#world{position:fixed;inset:0;width:100%;height:100%;background:#07111f}.hud{position:fixed;z-index:4;background:#071426d9;border:1px solid #41627e77;backdrop-filter:blur(8px);border-radius:11px}.hud.top{top:12px;left:12px;right:12px;height:48px;padding:12px 16px;display:flex;align-items:center;gap:18px}.progress{height:10px;flex:1;background:#1b2c3c;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#42d9ff,#79eea4);transition:.4s}#tasks{left:14px;top:75px;width:250px;padding:14px}#tasks h3{margin:0 0 8px;color:var(--cyan);font-size:12px;letter-spacing:.15em}.task{padding:6px;color:#b9cedd}.task.done{text-decoration:line-through;color:#58da91}.actions{position:fixed;z-index:5;right:18px;bottom:18px;display:flex;gap:9px}.overlay{position:fixed;z-index:20;inset:0;background:#030914dd;display:grid;place-items:center;padding:20px}.dialog{width:min(680px,100%);max-height:88vh;overflow:auto;background:#0d1d33;border:1px solid #416584;border-radius:18px;padding:25px;box-shadow:0 30px 80px #000}.dialog h2{color:var(--cyan)}.choice,.card{display:block;width:100%;text-align:left;margin:8px 0}.roleCard{text-align:center}.roleCard h1{font-size:54px}.roleCard.impostor h1{color:var(--red)}.roleCard.crewmate h1{color:var(--cyan)}#toast{position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:#101f35;border:1px solid #52799b;padding:12px 20px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1}.dash{width:min(1150px,calc(100% - 32px));margin:28px auto}.dash header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dash h1{margin:.1em 0}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.codeCard{text-align:center;background:linear-gradient(90deg,#1b5c80,#503f94);padding:25px;border-radius:16px}.codeCard strong{display:block;font:800 64px/1 ui-monospace;letter-spacing:.16em;margin:8px}.settings label input[type=checkbox]{display:inline;width:auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}#tasks{width:200px}.actions{left:12px;right:12px;justify-content:flex-end;flex-wrap:wrap}.hud.top{font-size:12px}.codeCard strong{font-size:42px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style></head><body class="teacher"><canvas id="stars"></canvas><main class="dash"><header><div><div class="eyebrow">THE MERIDIAN</div><h1>MISSION CONTROL</h1></div><div id="connection">OFFLINE</div></header><section id="create" class="panel"><h2>Launch a classroom mission</h2><p>No accounts. No tracking. Temporary room data only.</p><button id="createRoom" class="primary">CREATE SECURE ROOM</button></section><section id="control" class="hidden"><div class="codeCard"><small>STUDENT ROOM CODE</small><strong id="bigCode"></strong><span>Open this site on student devices</span></div><div class="grid"><section class="panel"><h2>Crew <span id="count"></span></h2><div id="players" class="roster"></div></section><section class="panel settings"><h2>Mission settings</h2><label>Maximum players<input id="maxPlayers" type="number" min="4" max="20" value="12"></label><label>Impostors<select id="impostors"><option value="">Automatic</option><option>1</option><option>2</option><option>3</option></select></label><label>Tasks each<input id="taskCount" type="number" min="1" max="5" value="3"></label><label>Kill cooldown<input id="killCooldown" type="number" min="5" max="60" value="25"></label><label><input id="devMode" type="checkbox"> Developer mode (start under 4)</label><button id="save">SAVE SETTINGS</button><label class="upload">Question bank JSON<input id="questions" type="file" accept=".json"></label></section></div><div class="toolbar"><button id="start" class="primary">START MISSION</button><button id="pause">PAUSE / RESUME</button><button id="end" class="danger">END ROUND</button><button id="rematch">RETURN TO LOBBY</button></div></section><p id="error" class="error"></p></main><script type="module">const $=s=>document.querySelector(s),wsUrl=()=>localStorage.suspectServer||`${location.protocol==='https:'?'wss':'ws'}://${location.host}/suspect-ws`;let ws,state,hostToken=localStorage.suspectHostToken,code=localStorage.suspectHostCode,paused=false;
function connect(){ws=new WebSocket(wsUrl());ws.onopen=()=>{ $('#connection').textContent='CONNECTED';if(hostToken&&code)send({type:'host',hostToken,code})};ws.onclose=()=>{ $('#connection').textContent='RECONNECTING';setTimeout(connect,1200)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='created'){hostToken=m.hostToken;code=m.code;localStorage.suspectHostToken=hostToken;localStorage.suspectHostCode=code;show()}else if(m.type==='hosted')show();else if(m.type==='state'){state=m;render()}else if(m.type==='error')err(m.message)}}
const send=x=>ws?.readyState===1&&ws.send(JSON.stringify(x)),err=x=>$('#error').textContent=x;function show(){$('#create').classList.add('hidden');$('#control').classList.remove('hidden');$('#bigCode').textContent=code}
function render(){if(!state)return;$('#count').textContent=`${state.players.length} / ${state.settings.maxPlayers}`;$('#players').innerHTML=state.players.map(p=>`<div class="crew"><i style="background:${p.color}"></i><b>${esc(p.nickname)}</b><small>${p.connected?'ONLINE':'RECONNECTING'} · ${p.ready?'READY':'NOT READY'}</small><button data-kick="${p.id}">×</button></div>`).join('');document.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>send({type:'kick',playerId:b.dataset.kick}));$('#start').disabled=state.phase!=='lobby'}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#createRoom').onclick=()=>send({type:'create'});$('#save').onclick=()=>send({type:'settings',settings:{maxPlayers:+$('#maxPlayers').value,impostors:+$('#impostors').value||null,taskCount:+$('#taskCount').value,killCooldown:+$('#killCooldown').value,devMode:$('#devMode').checked}});$('#start').onclick=()=>send({type:'start'});$('#pause').onclick=()=>send({type:'pause',paused:paused=!paused});$('#end').onclick=()=>send({type:'end'});$('#rematch').onclick=()=>send({type:'rematch'});$('#questions').onchange=async e=>{try{const q=JSON.parse(await e.target.files[0].text());send({type:'questions',questions:q.questions||q})}catch{err('That file is not valid JSON.')}};connect();

</script></body></html>
