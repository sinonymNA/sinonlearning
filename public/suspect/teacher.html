<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUSPECT Mission Control</title><link rel="stylesheet" href="/suspect/game.css"><link rel="stylesheet" href="/suspect/teacher.css"></head><body><canvas id="space"></canvas><main class="command"><header><div><span class="overline">THE MERIDIAN // SECURE CHANNEL</span><h1>MISSION CONTROL</h1></div><div id="connection" class="connection"><i></i> CONNECTING</div></header>
<section id="create" class="launch-card glass"><div class="launch-icon">M</div><div><span class="overline">CLASSROOM SESSION</span><h2>Launch a new mission</h2><p>Create a private room, choose question or classic mode, and project the code for your crew.</p></div><button id="createRoom" class="btn primary">CREATE SECURE ROOM →</button></section>
<section id="control" class="hidden"><div class="code-card"><div><span>STUDENT ROOM CODE</span><strong id="bigCode"></strong><small>Students open sinonlearning.org/suspect</small></div><div class="qr-look">M</div></div><div class="control-grid"><section class="glass panel"><div class="section-head"><h2>CREW MANIFEST</h2><span id="count">0 / 12</span></div><div id="players" class="teacher-roster"></div></section><section class="glass panel settings"><div class="section-head"><h2>MISSION SETTINGS</h2></div><label>GAME MODE<select id="gameMode"><option value="questions">Classroom Questions</option><option value="classic">Classic Ship Tasks</option></select></label><div class="two"><label>MAX PLAYERS<input id="maxPlayers" type="number" min="4" max="20" value="12"></label><label>IMPOSTORS<select id="impostors"><option value="">Automatic</option><option>1</option><option>2</option><option>3</option></select></label><label>TASKS EACH<input id="taskCount" type="number" min="1" max="5" value="3"></label><label>KILL COOLDOWN<input id="killCooldown" type="number" min="5" max="60" value="25"></label></div><label class="check"><input id="devMode" type="checkbox"> Allow testing with fewer than four players</label><button id="save" class="btn">SAVE SETTINGS</button><label class="upload">UPLOAD QUESTION BANK (.JSON)<input id="questions" type="file" accept=".json"></label></section></div><div class="toolbar"><button id="start" class="btn ready-btn">START MISSION</button><button id="pause" class="btn">PAUSE / RESUME</button><button id="rematch" class="btn">RETURN TO LOBBY</button><button id="end" class="btn end">END ROUND</button></div></section><p id="error" class="error"></p></main><script src="/suspect/poll-socket.js"></script><script type="module" src="/suspect/teacher.js"></script></body></html>
